# Synced from boycepoleonjr/conventions v{{conventions.version}} (CI-7).
# Removes the AI footer that coding agents append to PR and issue text (Generated by/with Claude Code, Codex, Cursor, Copilot or Jules; Co-Authored-By lines naming them; a claude.ai/code session link).
# Only the end of a body is cut; text in the middle is never touched. Edits made with GITHUB_TOKEN do not start new workflow runs, so there is no loop.
# Action refs (uses: ...@<sha>) are repo-owned after the first sync; Dependabot keeps them current (SUP-7).
# Opt out by adding "ai-attribution-scrub" to "skip" in .conventions.json.
name: AI attribution scrub
on:
  pull_request:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [opened, edited]
permissions: {}
jobs:
  scrub:
    name: scrub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // BEGIN aiAgents
            const AI_AGENTS = {
              // One entry per AI tool. `names` match a whole author or committer name or login (case-insensitive, a trailing [bot] is
              // ignored); `emails` match a whole email; `emailSuffixes` match the end of an email; `words` match inside a Co-Authored-By
              // trailer; `footers` are the tool names in a trailing "Generated by/with <tool>" line.
              agents: [
                { label: "Claude", names: ["claude"], emails: ["noreply@anthropic.com"], emailSuffixes: [], words: ["claude", "anthropic"], footers: ["Claude Code"] },
                { label: "Codex", names: ["codex", "chatgpt-codex-connector"], emails: ["codex@openai.com"], emailSuffixes: ["@openai.com", "+chatgpt-codex-connector[bot]@users.noreply.github.com"], words: ["codex"], footers: ["Codex", "OpenAI Codex"] },
                { label: "Cursor Agent", names: ["cursor agent", "cursoragent"], emails: ["cursoragent@cursor.com"], emailSuffixes: [], words: ["cursor agent"], footers: ["Cursor", "Cursor Agent"] },
                { label: "Copilot", names: ["copilot", "copilot-swe-agent"], emails: [], emailSuffixes: ["+copilot@users.noreply.github.com", "+copilot-swe-agent[bot]@users.noreply.github.com"], words: ["copilot"], footers: ["GitHub Copilot", "Copilot"] },
                { label: "Jules", names: ["jules", "google-labs-jules"], emails: [], emailSuffixes: ["+google-labs-jules[bot]@users.noreply.github.com"], words: ["google-labs-jules"], footers: ["Jules", "Google Jules"] },
                { label: "Gemini", names: ["gemini-code-assist"], emails: [], emailSuffixes: ["+gemini-code-assist[bot]@users.noreply.github.com"], words: ["gemini-code-assist"], footers: [] },
              ],
              // Trailer keys that mark a commit as made in an AI session.
              sessionTrailers: ["claude-session"],
              // Never AI authorship: Dependabot and GitHub Actions commits.
              ignore: { names: ["dependabot", "github-actions"], emailSuffixes: ["+dependabot[bot]@users.noreply.github.com", "+github-actions[bot]@users.noreply.github.com"] },
            };

            function agentOf(who) {
              // `who` is { name, email } or { login }: returns the label of the AI tool it identifies, or "".
              const norm = (v) => String(v || "").trim().toLowerCase().replace(/\[bot\]$/, "");
              const email = String(who.email || "").trim().toLowerCase();
              for (const a of AI_AGENTS.agents) {
                if (who.name && a.names.includes(norm(who.name))) return a.label;
                if (who.login && a.names.includes(norm(who.login))) return a.label;
                if (email && (a.emails.includes(email) || a.emailSuffixes.some((x) => email.endsWith(x)))) return a.label;
              }
              return "";
            }

            function agentInTrailer(value) {
              // `value` is the text after "Co-Authored-By:": returns the label of the AI tool it names, or "".
              const text = String(value || "").toLowerCase();
              const name = text.replace(/<[^>]*>/, "").trim();
              const email = (text.match(/<([^>]*)>/) || [])[1] || "";
              const who = agentOf({ name, email });
              if (who) return who;
              for (const a of AI_AGENTS.agents) {
                for (const w of a.words) {
                  if (new RegExp("(?<![\\w-])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\w-])").test(text)) return a.label;
                }
              }
              return "";
            }
            // END aiAgents
            // BEGIN scrubBody
            function scrubBody(body) {
              // Returns the body without a trailing AI footer, or the same string when there is nothing to remove.
              // Only the end of the body is ever cut: everything before the cut is returned byte for byte, line endings included.
              if (typeof body !== "string" || body === "") return body;
              const esc = (v) => v.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const tools = AI_AGENTS.agents.flatMap((a) => a.footers).sort((x, y) => y.length - x.length).map(esc).join("|");
              const generated = new RegExp("^\\s*[*_]*(?:\\u{1F916}\\uFE0F?\\s*)?Generated (?:by|with) (?:\\[(?:" + tools + ")\\]\\([^)\\s]*\\)|(?:" + tools + "))[*_]*\\.?\\s*$", "iu");
              const coAuthor = (t) => /^\s*co-authored-by[ \t]*:/i.test(t) && agentInTrailer(t.replace(/^[^:]*:/, "")) !== "";
              const session = /^\s*(?:claude-session:\s*)?(?:<|\[[^\]]*\]\()?https?:\/\/claude\.(?:ai|com)\/code\/session_[A-Za-z0-9_-]+(?:[?#][^\s)>]*)?[)>]?\s*$/i;
              const separator = /^\s*-{3,}\s*$/;
              const lines = [];
              for (let start = 0; ; ) {
                let end = start;
                while (end < body.length && body[end] !== "\n" && body[end] !== "\r") end++;
                lines.push({ text: body.slice(start, end), end });
                if (end >= body.length) break;
                start = end + (body[end] === "\r" && body[end + 1] === "\n" ? 2 : 1);
              }
              let i = lines.length - 1;
              let removed = false;
              for (; i >= 0; i--) {
                const t = lines[i].text;
                if (t.trim() === "") continue;
                if (generated.test(t) || coAuthor(t) || session.test(t)) { removed = true; continue; }
                if (removed && separator.test(t)) continue;
                break;
              }
              if (!removed) return body;
              return i < 0 ? "" : body.slice(0, lines[i].end);
            }
            // END scrubBody
            const { owner, repo } = context.repo;
            const payload = context.payload;
            const fullName = `${owner}/${repo}`;

            // GITHUB_TOKEN is read-only on fork PRs (and on Dependabot runs), so there is nothing to edit there.
            const prEvents = ["pull_request", "pull_request_review", "pull_request_review_comment"];
            if (prEvents.includes(context.eventName)) {
              const head = payload.pull_request && payload.pull_request.head && payload.pull_request.head.repo;
              if (!head || head.full_name !== fullName) {
                core.notice("The PR comes from a fork, so the token cannot write here. Nothing to scrub.");
                return;
              }
            }

            // Read the body again right before editing so a newer edit made after this event fired is never overwritten.
            let target;
            switch (context.eventName) {
              case "pull_request": {
                const pull_number = payload.pull_request.number;
                target = {
                  label: `PR #${pull_number} description`,
                  get: async () => (await github.rest.pulls.get({ owner, repo, pull_number })).data.body,
                  set: (body) => github.rest.pulls.update({ owner, repo, pull_number, body }),
                };
                break;
              }
              case "issues": {
                const issue_number = payload.issue.number;
                target = {
                  label: `issue #${issue_number} description`,
                  get: async () => (await github.rest.issues.get({ owner, repo, issue_number })).data.body,
                  set: (body) => github.rest.issues.update({ owner, repo, issue_number, body }),
                };
                break;
              }
              case "issue_comment": {
                const comment_id = payload.comment.id;
                target = {
                  label: `comment ${comment_id}`,
                  get: async () => (await github.rest.issues.getComment({ owner, repo, comment_id })).data.body,
                  set: (body) => github.rest.issues.updateComment({ owner, repo, comment_id, body }),
                };
                break;
              }
              case "pull_request_review_comment": {
                const comment_id = payload.comment.id;
                target = {
                  label: `review comment ${comment_id}`,
                  get: async () => (await github.rest.pulls.getReviewComment({ owner, repo, comment_id })).data.body,
                  set: (body) => github.rest.pulls.updateReviewComment({ owner, repo, comment_id, body }),
                };
                break;
              }
              case "pull_request_review": {
                const pull_number = payload.pull_request.number;
                const review_id = payload.review.id;
                target = {
                  label: `review ${review_id}`,
                  get: async () => (await github.rest.pulls.getReview({ owner, repo, pull_number, review_id })).data.body,
                  set: (body) => github.rest.pulls.updateReview({ owner, repo, pull_number, review_id, body }),
                };
                break;
              }
              default:
                core.setFailed(`Unsupported event ${context.eventName}.`);
                return;
            }

            const current = await target.get();
            const cleaned = scrubBody(current);
            if (cleaned === current) {
              core.info(`No AI footer at the end of the ${target.label}. Nothing changed.`);
              return;
            }
            // A body that is only a footer would become empty. Do not send an empty edit; leave it and say so.
            if (cleaned.trim() === "") {
              core.notice(`Removing the AI footer would leave the ${target.label} empty, so it was left as is.`);
              return;
            }
            try {
              await target.set(cleaned);
            } catch (err) {
              if (err && err.status === 403) {
                core.notice(`The token cannot edit the ${target.label} (${err.message}). Left as is.`);
                return;
              }
              throw err;
            }
            core.notice(`Removed the AI footer from the end of the ${target.label}.`);
