name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/*.test.mjs
      - run: bash -n scripts/cloud-setup.sh
      - name: Prettier-check rendered claude-review workflow
        if: matrix.node == 22
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          for variant in plain focus; do
            repo="$out/$variant"
            mkdir -p "$repo"
            echo '{"name":"demo","scripts":{"test":"t"}}' > "$repo/package.json"
            node scripts/sync.mjs --repo "$repo" --init --only claude-review
            if [ "$variant" = focus ]; then
              node -e 'const fs=require("fs"),f=process.argv[1]+"/.conventions.json",c=JSON.parse(fs.readFileSync(f));c.claude_review={focus:"Check RLS on new tables.\nFlag raw SQL in routes."};fs.writeFileSync(f,JSON.stringify(c))' "$repo"
              node scripts/sync.mjs --repo "$repo" --only claude-review
            fi
            npx --yes prettier@3 --no-config --check "$repo/.github/workflows/claude-code-review.yml"
          done
